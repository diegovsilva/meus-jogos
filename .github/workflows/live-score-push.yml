name: Checagem de placar ao vivo (notificações push)

on:
  schedule:
    # a cada 5 minutos. O plano Hobby do Vercel só permite cron 1x/dia,
    # então disparamos isso pelo GitHub Actions, que é gratuito.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de checagem de placar
        run: |
          curl -sS -f -X GET "${APP_URL}/api/cron/live-scores" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
